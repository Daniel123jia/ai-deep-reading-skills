name: paperscope-ai-deep-reading
version: 1.2.0
description: >
  Deep-read academic papers for PaperScope. Turns parsed paper content into
  evidence-grounded structured analysis with source-boundary tracking,
  claim-level evidence, assumption auditing, and reading mode routing.

skill_file: ../SKILL.md
schema_file: ../schemas/deep-reading-result.schema.json
evidence_rules_file: ../references/evidence-rules.md

trigger_phrases:
  - AI paper deep reading
  - paper understanding
  - method analysis
  - claim-evidence review
  - assumption audit
  - research follow-up
  - 论文精读
  - 方法分析
  - 证据审查
  - 研究跟进

reading_modes:
  - id: quick_summary
    description: One-card summary. Emphasizes judgment_card and research_question while preserving the full schema-required JSON shell.
  - id: standard
    description: Full deep reading report. Default mode.
  - id: reviewer_mode
    description: Peer-review style. Emphasizes critical_review, claim_evidence, and evidence_audit.
  - id: followup_mode
    description: Research planning. Emphasizes open_questions, method_summary, and contributions.
  - id: method_only
    description: Technical deep-dive. Emphasizes method_summary, assumptions, and claim_evidence.

output:
  primary: structured JSON conforming to schemas/deep-reading-result.schema.json v1.2
  secondary: optional human-readable summary when conversational output is requested

constraints:
  max_papers_per_call: 5
  min_evidence_grade_for_deep_reading: E2_BODY_TEXT
  schema_version: "1.2"
  require_source_boundary: true
  require_claim_level_evidence: true
  forbid_generated_snippets: true

model_notes: >
  Always resolve reading_mode before starting analysis.
  Always establish source_boundary: evidence grade, evidence coverage,
  locator mode, and context mode.
  Never fabricate evidence refs, locations, numbers, snippets, figures,
  tables, equations, datasets, baselines, or citations.
  Put verbatim source text only in snippet; if no inspected source text is
  available, use snippet: null and provide a paraphrase or verification
  suggestion instead.
  Each important claim must include claim_id, importance, evidence refs,
  support reason, scope boundary, unsupported stronger claim, and what would
  strengthen it.
  Separate paper-relative novelty from externally verified field novelty.
  Do not claim field-level novelty, first-in-field status, or SOTA across the
  field unless context_mode records external verification and evidence refs
  support it.
  Apply both downgrade rules and protect rules from evidence-rules.md.
  High-risk assumptions are determined by risk_level, not provenance, and must
  appear in both method_summary.assumptions
  and critical_review.fragile_assumptions.

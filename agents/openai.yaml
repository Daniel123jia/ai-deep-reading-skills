name: paperscope-ai-deep-reading
version: 1.5.0
description: >
  Deep-read academic papers with traceable claim-evidence grounding,
  experiment-evidence chains, assumption stress tests, and guided return-to-source reading.

skill_file: ../SKILL.md
schema_file: ../schemas/deep-reading-result.schema.json
evidence_rules_file: ../references/evidence-rules.md

trigger_phrases:
  - AI paper deep reading
  - paper understanding
  - claim evidence
  - method analysis
  - assumption audit
  - research follow-up
  - 论文精读
  - 方法分析
  - 证据审查
  - 批判性阅读
  - 精读建议

reading_modes:
  - id: standard
    description: Full six-stage deep reading with traceability and guided reading.
  - id: quick_summary
    description: Fast triage; grounding core still runs.
  - id: reviewer_mode
    description: Emphasize evidence quality, limitations, assumptions, and reviewer questions.
  - id: followup_mode
    description: Emphasize open questions, fragile assumptions, and validation paths.
  - id: method_only
    description: Emphasize Method Diff, modules, equations, assumptions, and ablations.

output:
  primary: structured JSON conforming to schemas/deep-reading-result.schema.json v1.5
  secondary: optional concise conversational summary

constraints:
  schema_version: "1.5"
  max_papers_per_call: 5
  min_evidence_grade_for_deep_reading: E2_BODY_TEXT
  require_source_boundary: true
  require_claim_level_evidence: true
  require_guided_reading_for_standard: true
  forbid_generated_snippets: true
  separate_internal_support_from_external_verification: true

model_notes: >
  Build evidence inventory before interpretation. Use reported only for paper-explicit
  statements, inferred for PaperScope analysis, and unknown only for genuine non-establishment.
  Maintain Claim→Evidence links and Evidence→Claim backlinks. Quantitative claims should
  be traceable to direct numeric evidence. Standard E2/E3 reading should include open
  questions and a source-grounded reading path. Never invent locators, snippets, formulas,
  figures, tables, field novelty, or universal conclusions.

  v1_5_notes: Require core weaknesses, actionable claim strengthening, bounded research directions, and guided return-to-source reading.
